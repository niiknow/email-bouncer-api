# Local development overrides.
# Copy to docker-compose.override.yml (gitignored); `docker compose up` loads it automatically.
services:
  bouncer:
    environment:
      # Re-check PHP files on every request so code edits apply without a restart.
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      PHP_OPCACHE_REVALIDATE_FREQ: "0"
      # Keep dev dependencies (phpunit, etc.) when composer install runs at start-up.
      COMPOSER_NO_DEV: "0"
    ports:
      - "8080:8080"
